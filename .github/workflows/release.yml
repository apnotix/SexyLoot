name: Bump, tag and release

# Läuft bei jedem Push auf master:
#   1. erhöht die Patch-Nummer in SexyLoot.toc (## Version:), committet und legt einen Tag an
#   2. baut das Addon-Paket mit BigWigsMods/packager und veröffentlicht es
#      auf GitHub (immer), CurseForge (wenn X-Curse-Project-ID in der TOC steht
#      und CF_API_KEY gesetzt ist) und WoWInterface (wenn X-WoWI-ID und WOWI_API_TOKEN gesetzt sind).
#
# Der Bump-Commit stammt von github-actions[bot] und löst den Workflow nicht erneut aus.
# Bump und Paketbau laufen absichtlich in einem Job: Tags, die mit dem GITHUB_TOKEN
# gepusht werden, starten keine weiteren Workflows.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          current=$(grep -oP '(?<=## Version: )[0-9]+\.[0-9]+\.[0-9]+' SexyLoot.toc)

          if [ -z "$current" ]; then
            echo "Could not find a ## Version: X.Y.Z line in SexyLoot.toc" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          new="$major.$minor.$patch"

          sed -i "s/## Version: .*/## Version: $new/" SexyLoot.toc
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SexyLoot.toc
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:master
          git push origin "${{ steps.bump.outputs.new_version }}"

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
